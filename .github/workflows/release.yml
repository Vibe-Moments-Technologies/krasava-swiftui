name: 🚀 Release

# Релиз запускается ТОЛЬКО тегом. Канал выводится из тега:
#   v26.1.0          → stable (latest)
#   v26.1.0-beta.3   → prerelease
#   v26.1.0-rc.1     → prerelease
# Push в main сюда не попадает — тестовые сборки собирает preview.yml.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, например v26.1.0 или v26.1.0-beta.1'
        required: true
        type: string
      publish:
        description: 'Публиковать релиз? Выключи для сборки без публикации.'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  resolve:
    name: 🧭 Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      channel: ${{ steps.ver.outputs.channel }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      build_id: ${{ steps.ver.outputs.build_id }}
      commit_sha: ${{ steps.ver.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🧭 Validate tag & resolve version
        id: ver
        env:
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: python3 tools/versioning.py resolve --tag "$TAG"

  build:
    name: 🍏 Build unsigned IPA
    runs-on: macos-26
    needs: resolve
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}

      - name: 🛠️ Select Xcode 26
        run: |
          FOUND=""
          for APP in /Applications/Xcode_26*.app /Applications/Xcode.app; do
            if [ -d "$APP" ]; then
              VERSION=$(defaults read "$APP/Contents/Info" CFBundleShortVersionString 2>/dev/null || echo "0")
              case "$VERSION" in
                26.*) sudo xcode-select -s "$APP/Contents/Developer"; FOUND="$APP"; break ;;
              esac
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::Xcode 26 не найден на раннере."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          xcodebuild -version

      - name: 📱 Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          for runtime in sorted(data, reverse=True):
              for device in data[runtime]:
                  if 'iPhone' in device['name']:
                      print(device['udid'])
                      raise SystemExit
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: 🧪 Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project KrasavaSwiftUI.xcodeproj \
            -scheme KrasavaSwiftUI \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -quiet

      - name: 🔨 Build app (no codesign)
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD_ID: ${{ needs.resolve.outputs.build_id }}
        run: |
          xcodebuild build \
            -project KrasavaSwiftUI.xcodeproj \
            -scheme KrasavaSwiftUI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -quiet

      - name: 🔏 Ad-hoc подпись с entitlements (App Group для виджета)
        # ad-hoc (identity "-") не требует сертификата, но вшивает entitlements
        # в бинарник. Инструмент переподписи (AltStore/GBox/Feather/ESign)
        # увидит заявленную App Group и сохранит её на .appex — иначе виджет
        # после переподписи останется без общего контейнера. Вложенные бандлы
        # подписываются ПЕРВЫМИ.
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Собранный .app не найден."
            exit 1
          fi
          echo "App: $APP_PATH"
          if [ -d "$APP_PATH/PlugIns/KrasavaWidget.appex" ]; then
            codesign --force --sign - --entitlements Support/KrasavaWidget.entitlements \
              "$APP_PATH/PlugIns/KrasavaWidget.appex"
          fi
          codesign --force --sign - --entitlements Support/KrasavaSwiftUI.entitlements "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" || true

      - name: 📦 Package unsigned IPA
        env:
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          if [ "$CHANNEL" = "stable" ]; then
            IPA="KrasavaSwiftUI.ipa"
          else
            IPA="KrasavaSwiftUI-v${VERSION}.ipa"
          fi
          zip -qry "$IPA" Payload
          rm -rf Payload
          echo "IPA_NAME=$IPA" >> "$GITHUB_ENV"
          ls -lh "$IPA"

      - name: 📤 Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: KrasavaSwiftUI-IPA
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error

  publish:
    name: 🚀 Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [resolve, build]
    if: |
      always() && needs.build.result == 'success' &&
      (github.event_name == 'push' || inputs.publish == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: 📥 Download IPA
        uses: actions/download-artifact@v4
        with:
          name: KrasavaSwiftUI-IPA
          path: dist

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🐍 Generate release notes
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD_ID: ${{ needs.resolve.outputs.build_id }}
          SHA: ${{ needs.resolve.outputs.commit_sha }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          version = os.environ["VERSION"]
          build = os.environ["BUILD_ID"]
          sha = os.environ["SHA"]
          channel = os.environ["CHANNEL"]
          ipa = next(pathlib.Path("dist").glob("*.ipa"), None)
          name = ipa.name if ipa else "—"
          lines = [
              f"### 📱 Krasava SwiftUI v{version}",
              "",
              f"**Канал:** `{channel}` · **сборка:** `#{build}` · **коммит:** `{sha}`",
              "",
              "**Установка:** IPA собран без подписи. Для установки переподпишите его",
              "любым инструментом (AltStore, GBox, Feather, ESign, Sideloadly).",
              "App Group уже заявлена в entitlements — виджет продолжит работать",
              "после переподписи.",
              "",
              f"**Файл:** `{name}`",
          ]
          pathlib.Path("release_notes.md").write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: 🚀 Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Релиз $TAG уже существует. Stable/beta/rc неизменяемы — поднимите версию."
            exit 1
          fi
          ARGS=(--title "Krasava SwiftUI v${VERSION}" -F release_notes.md)
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          else
            ARGS+=(--latest)
          fi
          gh release create "$TAG" dist/*.ipa "${ARGS[@]}"