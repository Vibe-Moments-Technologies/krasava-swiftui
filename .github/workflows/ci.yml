name: 🧪 CI

# Проверка каждого пуша и пул-реквеста: собирается ли проект и проходят ли
# тесты домена. Ничего не публикует — это отдельные воркфлоу.
on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: 🛠️ Build & Test
    # macos-26 — единственный образ с Xcode 26 и SDK iOS 26. Ниже
    # SDK 26 проект не соберётся: минимальная версия iOS 26 и Liquid Glass
    # объявлены именно там.
    runs-on: macos-26
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Select Xcode 26
        run: |
          FOUND=""
          for APP in /Applications/Xcode_26*.app /Applications/Xcode.app; do
            if [ -d "$APP" ]; then
              VERSION=$(defaults read "$APP/Contents/Info" CFBundleShortVersionString 2>/dev/null || echo "0")
              case "$VERSION" in
                26.*) sudo xcode-select -s "$APP/Contents/Developer"; FOUND="$APP"; break ;;
              esac
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::Xcode 26 не найден на раннере."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 📱 Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          for runtime in sorted(data, reverse=True):
              for device in data[runtime]:
                  if 'iPhone' in device['name']:
                      print(device['udid'])
                      raise SystemExit
          ")
          if [ -z "$UDID" ]; then
            echo "::error::Доступных симуляторов iPhone нет."
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Симулятор: $UDID"

      - name: 🧪 Run tests
        run: |
          set -o pipefail
          ARGS=(
            -project KrasavaSwiftUI.xcodeproj
            -scheme KrasavaSwiftUI
            -destination "id=${{ steps.sim.outputs.udid }}"
            -derivedDataPath build
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
          )
          # xcbeautify есть не на каждом образе: без него логи читаются хуже,
          # но падение всё равно видно по коду возврата. `set -o pipefail`
          # обязателен, иначе ошибка xcodebuild потеряется в пайпе.
          if command -v xcbeautify >/dev/null 2>&1; then
            xcodebuild test "${ARGS[@]}" | xcbeautify --renderer github-actions
          else
            xcodebuild test "${ARGS[@]}" -quiet
          fi

      - name: 🔨 Build for device (no codesign)
        run: |
          xcodebuild build \
            -project KrasavaSwiftUI.xcodeproj \
            -scheme KrasavaSwiftUI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -quiet