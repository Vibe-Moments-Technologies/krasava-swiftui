name: 🧪 CI

# Проверка пуша в ветку и пул-реквеста: собирается ли проект и проходят ли
# тесты домена. Ничего не публикует — это отдельные воркфлоу.
on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: 🛠️ Build & Test
    # macos-26 — единственный образ с Xcode 26 и SDK iOS 26. Ниже SDK 26
    # проект не соберётся: минимальная версия iOS 26 и Liquid Glass объявлены
    # именно там.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: 🛠️ Select Xcode 26
        uses: ./.github/actions/select-xcode-26

      - name: 📱 Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          for runtime in sorted(data, reverse=True):
              for device in data[runtime]:
                  if 'iPhone' in device['name']:
                      print(device['udid'])
                      raise SystemExit
          ")
          if [ -z "$UDID" ]; then
            echo "::error::Доступных симуляторов iPhone нет."
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Симулятор: $UDID"

      - name: 🧪 Run tests
        run: |
          set -o pipefail
          ARGS=(
            -project KrasavaSwiftUI.xcodeproj
            -scheme KrasavaSwiftUI
            -destination "id=${{ steps.sim.outputs.udid }}"
            -derivedDataPath build
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
          )
          # xcbeautify есть не на каждом образе: без него логи читаются хуже,
          # но падение всё равно видно по коду возврата. `set -o pipefail`
          # обязателен, иначе ошибка xcodebuild потеряется в пайпе.
          if command -v xcbeautify >/dev/null 2>&1; then
            xcodebuild test "${ARGS[@]}" | xcbeautify --renderer github-actions
          else
            xcodebuild test "${ARGS[@]}"
          fi

      - name: 🔨 Build app (no codesign)
        run: bash tools/build_ios_unsigned.sh