name: 🚧 Preview (rolling)

# Тестовая сборка main. Каждый push собирает {VERSION}-dev.N и заменяет файлы
# в ОДНОМ rolling-релизе `preview`: GitHub Releases не плодятся, обычные
# пользователи этих сборок не видят.
on:
  push:
    branches:
      - main
    paths:
      - 'KrasavaSwiftUI/**'
      - 'KrasavaWidget/**'
      - 'KrasavaSwiftUITests/**'
      - 'Shared/**'
      - 'Support/**'
      - 'KrasavaSwiftUI.xcodeproj/**'
      - 'tools/**'
      - 'VERSION'
      - '.github/workflows/preview.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  resolve:
    name: 🧭 Resolve dev version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build_id: ${{ steps.ver.outputs.build_id }}
    steps:
      - uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🧭 Resolve version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 404 (релиза preview ещё нет) gh отдаёт JSON в stdout с кодом 1 —
          # сбрасываем PREV, иначе JSON уедет в --prev-version.
          PREV="$(gh api "repos/${{ github.repository }}/releases/tags/preview" --jq .name 2>/dev/null)" || PREV=""
          python3 tools/versioning.py resolve --channel dev --prev-version "${PREV:-}"

  build:
    name: 🍏 Build preview IPA
    runs-on: macos-26
    needs: resolve
    steps:
      - uses: actions/checkout@v4

      - name: 🛠️ Select Xcode 26
        uses: ./.github/actions/select-xcode-26

      # Тесты гоняются и здесь, а не только в CI: CI пропускает ветку main,
      # поэтому без этого шага push в main не проверял бы тесты вообще.
      - name: 📱 Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          for runtime in sorted(data, reverse=True):
              for device in data[runtime]:
                  if 'iPhone' in device['name']:
                      print(device['udid'])
                      raise SystemExit
          ")
          if [ -z "$UDID" ]; then
            echo "::error::Доступных симуляторов iPhone нет."
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: 🧪 Run tests
        run: |
          set -o pipefail
          rm -rf build/TestResults.xcresult
          xcodebuild test \
            -project KrasavaSwiftUI.xcodeproj \
            -scheme KrasavaSwiftUI \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: 📸 Screenshot screens
        # Честные скриншоты с симулятора. ImageRenderer для этого не годится:
        # он не рисует lazy-контейнеры, NavigationStack и живые эффекты, и
        # вместо экрана получается пустой прямоугольник.
        #
        # Приложение запускается с аргументами: -seedDemo заполняет стор
        # демонстрационными данными (DEBUG), -screenshotScreen открывает нужный
        # экран без ручной навигации.
        if: always()
        run: |
          mkdir -p snapshots
          UDID="${{ steps.sim.outputs.udid }}"
          APP="build/Build/Products/Debug-iphonesimulator/KrasavaSwiftUI.app"
          BUNDLE_ID="ru.vibemoments.krasavaswiftui"

          if [ ! -d "$APP" ]; then
            echo "::warning::Debug-сборка приложения не найдена — снимков не будет."
            ls -la build/Build/Products 2>/dev/null || true
            exit 0
          fi

          xcrun simctl bootstatus "$UDID" -b || true
          xcrun simctl install "$UDID" "$APP"

          for APPEARANCE in light dark; do
            xcrun simctl ui "$UDID" appearance "$APPEARANCE" || true
            for SCREEN in schedule settings about lesson; do
              xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE_ID" \
                -seedDemo YES -screenshotScreen "$SCREEN" > /dev/null
              sleep 4
              xcrun simctl io "$UDID" screenshot \
                "snapshots/${SCREEN}-${APPEARANCE}.png" > /dev/null 2>&1 || true
            done
          done

          echo "==> Снимков: $(find snapshots -name '*.png' | wc -l)"
          ls -la snapshots

      - name: 📤 Upload UI snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KrasavaSwiftUI-snapshots
          path: snapshots
          if-no-files-found: warn
      - name: 🔨 Build app (no codesign)
        env:
          MARKETING_VERSION: ${{ needs.resolve.outputs.version }}
          CURRENT_PROJECT_VERSION: ${{ needs.resolve.outputs.build_id }}
        run: bash tools/build_ios_unsigned.sh

      - name: 📦 Package unsigned IPA
        env:
          OUTPUT: KrasavaSwiftUI-preview.ipa
        run: bash tools/package_ipa.sh

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KrasavaSwiftUI-preview-IPA
          path: KrasavaSwiftUI-preview.ipa
          if-no-files-found: error

  publish:
    name: 🚀 Publish rolling preview
    runs-on: ubuntu-latest
    needs: [resolve, build]
    if: needs.build.result == 'success'
    steps:
      # gh определяет репозиторий из git-контекста: без checkout публикация
      # падает с «fatal: not a git repository».
      - uses: actions/checkout@v4

      - name: 📥 Download IPA
        uses: actions/download-artifact@v4
        with:
          name: KrasavaSwiftUI-preview-IPA
          path: dist

      - name: 🚀 Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD_ID: ${{ needs.resolve.outputs.build_id }}
        run: |
          cat > notes.md <<EOF
          ### 🚧 Rolling-сборка ветки \`main\`

          **Версия:** \`${VERSION}\` · **сборка:** \`#${BUILD_ID}\`

          IPA без подписи — переподпишите любым инструментом для sideload.
          EOF
          if gh release view preview >/dev/null 2>&1; then
            gh release edit preview \
              --title "Preview ${VERSION} (сборка #${BUILD_ID})" \
              -F notes.md --prerelease
            gh release upload preview dist/*.ipa --clobber
          else
            gh release create preview dist/*.ipa \
              --title "Preview ${VERSION} (сборка #${BUILD_ID})" \
              -F notes.md --prerelease
          fi