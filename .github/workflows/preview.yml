name: 🚧 Preview (rolling)

# Тестовая сборка main. Каждый push собирает {VERSION}-dev.N и заменяет файлы
# в ОДНОМ rolling-релизе `preview`: GitHub Releases не плодятся, обычные
# пользователи этих сборок не видят.
on:
  push:
    branches:
      - main
    paths:
      - 'KrasavaSwiftUI/**'
      - 'KrasavaWidget/**'
      - 'Shared/**'
      - 'Support/**'
      - 'KrasavaSwiftUI.xcodeproj/**'
      - 'VERSION'
      - '.github/workflows/preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  resolve:
    name: 🧭 Resolve dev version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build_id: ${{ steps.ver.outputs.build_id }}
    steps:
      - uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🧭 Resolve version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 404 (релиза preview ещё нет) gh отдаёт JSON в stdout с кодом 1 —
          # сбрасываем PREV, иначе JSON уедет в --prev-version.
          PREV="$(gh api "repos/${{ github.repository }}/releases/tags/preview" --jq .name 2>/dev/null)" || PREV=""
          python3 tools/versioning.py resolve --channel dev --prev-version "${PREV:-}"

  build:
    name: 🍏 Build preview IPA
    runs-on: macos-26
    needs: resolve
    steps:
      - uses: actions/checkout@v4

      - name: 🛠️ Select Xcode 26
        run: |
          FOUND=""
          for APP in /Applications/Xcode_26*.app /Applications/Xcode.app; do
            if [ -d "$APP" ]; then
              VERSION=$(defaults read "$APP/Contents/Info" CFBundleShortVersionString 2>/dev/null || echo "0")
              case "$VERSION" in
                26.*) sudo xcode-select -s "$APP/Contents/Developer"; FOUND="$APP"; break ;;
              esac
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::Xcode 26 не найден на раннере."
            exit 1
          fi
          xcodebuild -version
          echo '--- installed SDKs ---'
          xcodebuild -showsdks || true
          echo '--- installed platforms ---'
          xcodebuild -showComponentPlatforms 2>/dev/null || true

      - name: 🔨 Build app (no codesign)
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD_ID: ${{ needs.resolve.outputs.build_id }}
        run: |
          xcodebuild build \
            -project KrasavaSwiftUI.xcodeproj \
            -scheme KrasavaSwiftUI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -quiet

      - name: 🔏 Ad-hoc подпись с entitlements
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -d "$APP_PATH/PlugIns/KrasavaWidget.appex" ]; then
            codesign --force --sign - --entitlements Support/KrasavaWidget.entitlements \
              "$APP_PATH/PlugIns/KrasavaWidget.appex"
          fi
          codesign --force --sign - --entitlements Support/KrasavaSwiftUI.entitlements "$APP_PATH"

      - name: 📦 Package unsigned IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry KrasavaSwiftUI-preview.ipa Payload
          rm -rf Payload

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KrasavaSwiftUI-preview-IPA
          path: KrasavaSwiftUI-preview.ipa
          if-no-files-found: error

  publish:
    name: 🚀 Publish rolling preview
    runs-on: ubuntu-latest
    needs: [resolve, build]
    if: needs.build.result == 'success'
    steps:
      - name: 📥 Download IPA
        uses: actions/download-artifact@v4
        with:
          name: KrasavaSwiftUI-preview-IPA
          path: dist

      - name: 🚀 Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD_ID: ${{ needs.resolve.outputs.build_id }}
        run: |
          cat > notes.md <<EOF
          ### 🚧 Rolling-сборка ветки \`main\`

          **Версия:** \`${VERSION}\` · **сборка:** \`#${BUILD_ID}\`

          IPA без подписи — переподпишите любым инструментом для sideload.
          EOF
          if gh release view preview >/dev/null 2>&1; then
            gh release edit preview \
              --title "Preview ${VERSION} (сборка #${BUILD_ID})" \
              -F notes.md --prerelease
            gh release upload preview dist/*.ipa --clobber
          else
            gh release create preview dist/*.ipa \
              --title "Preview ${VERSION} (сборка #${BUILD_ID})" \
              -F notes.md --prerelease
          fi